# OmniBenchmark Module Configuration

entrypoints:
  default: pca.py
  pca: pca.py

# Pointed to shared CLI helper code
templates:
  repo: https://github.com/omni-scrna/boilerplate
  ref: main
  lang: python

# Benchmark(s) that this module plugs into; `sync` vendors each one's schema/ dir
# into src/common/schema/.
benchmarks:
  - name: split-stages
    repo: https://github.com/btraven00/omni-scrna-plan  # embed-gen: RDIMR schema, not on upstream main yet
    plan: benchmark_conda.yaml
    ref: embed-gen
