---
name: bipca
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  # bipca is not on conda-forge, so it comes from pip. Every one of its declared
  # deps is listed here so conda solves them and pip only has bipca left to
  # install -- a conda `pip:` block cannot pass --no-deps, and without this pip
  # would happily replace the conda numpy/torch. Same convention as envs/sc3s.yml.
  - numpy
  - scipy>=1.5.2
  - pandas>=1.1.3
  - scikit-learn>=0.24.2
  - matplotlib-base>=3.6.0
  - anndata>=0.7.5
  - tasklogger>=1.0.0
  - loguru>=0.7.2
  - typeguard
  - typing_extensions
  - threadpoolctl
  # Hard dependency of the PyPI package even though this module runs on CPU:
  # bipca imports torch at module load and only switches to the scipy backend
  # once it sees a sparse matrix.
  - pytorch-cpu>=1.12
  # module I/O: the stage hands us an h5ad plus a TENx-format HDF5
  - h5py
  - pip
  - pip:
      - bipca==1.1.0
