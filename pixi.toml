[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge"]
name = "bipca"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "python tests/smoke.py"
export-env = "pixi workspace export conda-environment --name bipca envs/bipca.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/bipca.yml"

# bipca is PyPI-only. Every one of its declared deps is here so conda solves
# them and pip has only bipca left to install (a conda `pip:` block cannot pass
# --no-deps, and without this pip would replace the conda numpy/torch).
[dependencies]
python = ">=3.13,<3.14"
numpy = ">=2,<3"
scipy = ">=1.5.2,<2"
pandas = ">=2,<3"
scikit-learn = ">=1,<2"
matplotlib-base = ">=3.6,<4"
anndata = ">=0.11,<0.14"
tasklogger = ">=1"
loguru = ">=0.7.2"
typeguard = "*"
typing_extensions = "*"
threadpoolctl = "*"
# hard dep of the PyPI package; bipca switches to scipy on sparse input anyway
pytorch-cpu = ">=2,<3"

[pypi-dependencies]
bipca = "==1.1.0"
